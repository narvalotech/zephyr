CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=2048

# CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_LS0XX=y
CONFIG_DISPLAY=y
CONFIG_DISPLAY_LOG_LEVEL_ERR=y

CONFIG_LOG=y

# Display library
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_LVGL=y
CONFIG_LVGL_USE_LABEL=y
CONFIG_LVGL_USE_CONT=y
CONFIG_LVGL_USE_BTN=y
CONFIG_LVGL_USE_THEME_MONO=y
CONFIG_LVGL_DISP_DEF_REFR_PERIOD=0
CONFIG_LVGL_USE_THEME_MATERIAL=y

# Hardware-specific
CONFIG_LVGL_DISPLAY_DEV_NAME="LS0XX"
CONFIG_LVGL_HOR_RES_MAX=128
CONFIG_LVGL_VER_RES_MAX=128
CONFIG_LVGL_VDB_SIZE=16
CONFIG_LVGL_DPI=150
CONFIG_LVGL_BITS_PER_PIXEL=1
CONFIG_LVGL_COLOR_DEPTH_1=y
